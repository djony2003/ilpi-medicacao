# PostgreSQL para desenvolvimento local.
#   docker compose up -d
#   cp .env.example .env
#   npm run db:setup && npm run db:migrar
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ilpi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ilpi_pgdata:
